<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1 class="game__title">Snake</h1>
      <div class="game__score" id="score">Score: 0</div>
      <div class="game__board">
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="game__overlay" id="overlay" hidden>
          <div class="game__overlay-message" id="overlay-message">
            Press SPACE to start
          </div>
          <button class="game__restart" id="restart" type="button" hidden>
            Restart
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
